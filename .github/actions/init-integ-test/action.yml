name: Initialize Integration Test
description: Sets up the environment for running integration tests.

runs:
  using: composite
  steps:
    - name: Download dist
      if: ${{ env.SKIP_DIST != 'true' && !env.ACT }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: dist
        path: dist/
